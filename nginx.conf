server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Las rutas de Angular (/home, /ruleta...) las resuelve el router del cliente.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Los ficheros con hash en el nombre no cambian nunca.
  location ~* \.(js|css|ico|png|jpg|svg|woff2?)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
