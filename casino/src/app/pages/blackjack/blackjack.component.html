<app-header
  [nombre]="nombre"
  [saldo]="saldo"
  (changeName)="onChangeName()"
  (changePassword)="onChangePassword()"
  (addSaldo)="onAddSaldo()"
  (logout)="onLogout()"
  (goHome)="onGoHome()"
/>

<div class="blackjack-container">
  <h2>Blackjack</h2>

  <div *ngIf="mostrarApuesta" class="apuesta-form">
    <p>¿Cuánto deseas apostar?</p>
    <input type="number" min="1" [max]="saldo" placeholder="Ej: 50" #apuestaInput />
    <button (click)="apostar(apuestaInput.value)">🎲 Apostar</button>
    <p class="error" *ngIf="mensajeApuesta">{{ mensajeApuesta }}</p>
  </div>

  <div class="mesa">
    <div class="mano">
      <h3>Crupier</h3>
      <div class="cartas">
        <div class="carta" *ngFor="let carta of dealerHand">
          {{ carta }}
        </div>
      </div>
      <p>Puntos: {{ calcularPuntos(dealerHand) }}</p>
    </div>

    <div class="mano">
      <h3>Tú</h3>
      <div class="cartas">
        <div class="carta" *ngFor="let carta of playerHand">
          {{ carta }}
        </div>
      </div>
      <p>Puntos: {{ calcularPuntos(playerHand) }}</p>
    </div>
  </div>

  <div class="controles" *ngIf="!juegoTerminado && turnoJugador">
    <button (click)="pedirCarta()">🃏 Pedir carta</button>
    <button (click)="plantarse()">✋ Plantarse</button>
  </div>

  <div class="resultado" *ngIf="juegoTerminado">
    <p>{{ resultado }}</p>
    <button (click)="iniciarJuego()">🔁 Nuevo juego</button>
  </div>
</div>
