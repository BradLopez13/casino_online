<div class="modal-backdrop">
  <div class="modal-content">
    <ng-container *ngIf="!mensajeRechazo; else bloqueado">
      <h2>Verificación de Edad</h2>
      <p>Debes confirmar que tienes al menos 18 años para usar este casino.</p>
      <div class="buttons">
        <button (click)="aceptar()">Sí, tengo más de 18</button>
        <button (click)="rechazar()">No</button>
      </div>
    </ng-container>

    <ng-template #bloqueado>
      <h2>Acceso Denegado</h2>
      <p>No puedes acceder al casino si no eres mayor de edad.</p>
    </ng-template>
  </div>
</div>
