<div class="curtain">
  <div
    class="gate plaque"
    role="alertdialog"
    aria-modal="true"
    aria-labelledby="edad-titulo"
    aria-describedby="edad-texto">
    <ng-container *ngIf="!mensajeRechazo; else bloqueado">
      <p class="eyebrow">{{ t('edad.eyebrow') }}</p>
      <h2 class="display" id="edad-titulo" [innerHTML]="t('edad.titulo')"></h2>
      <p id="edad-texto">{{ t('edad.texto') }}</p>
      <div class="dialog-actions split">
        <button #primario type="button" class="btn btn-primary" (click)="aceptar()">{{ t('edad.aceptar') }}</button>
        <button type="button" class="btn btn-danger" (click)="rechazar()">{{ t('edad.rechazar') }}</button>
      </div>
    </ng-container>

    <ng-template #bloqueado>
      <p class="eyebrow">{{ t('edad.denegadoEyebrow') }}</p>
      <h2 class="display" id="edad-titulo" [innerHTML]="t('edad.denegadoTitulo')"></h2>
      <p id="edad-texto" role="status">{{ t('edad.denegadoTexto') }}</p>
      <div class="countdown" aria-hidden="true"></div>
    </ng-template>
  </div>

  <p class="gate-foot mono" aria-hidden="true">{{ t('edad.pie') }}</p>
</div>
