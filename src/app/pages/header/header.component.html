<a class="skip-link" href="#contenido">Saltar al contenido</a>

<header class="topbar">
  <button type="button" class="brand" (click)="onGoHome()" aria-label="Meridiano, volver al salón">
    <span class="brand-mark" aria-hidden="true"></span>
    <span class="brand-word">Meridiano</span>
    <span class="brand-sub mono">Salón de juego</span>
  </button>

  <div class="account" #dropdownRef>
    <div class="balance" aria-live="polite" aria-atomic="true">
      <span class="balance-label">Saldo</span>
      <span class="balance-value mono">{{ saldo | currency:'EUR' }}</span>
    </div>

    <button
      type="button"
      class="account-toggle"
      id="menu-cuenta-toggle"
      aria-haspopup="menu"
      [attr.aria-expanded]="menuAbierto"
      aria-controls="menu-cuenta"
      (click)="toggleMenu()"
      (keydown)="onToggleKeydown($event)">
      <span class="avatar mono" aria-hidden="true">{{ inicial }}</span>
      <span class="account-name">{{ nombre }}</span>
      <app-icon name="chevron" class="account-chevron" [class.open]="menuAbierto"></app-icon>
    </button>

    <div
      class="menu"
      id="menu-cuenta"
      role="menu"
      aria-labelledby="menu-cuenta-toggle"
      *ngIf="menuAbierto"
      (keydown)="onMenuKeydown($event)">
      <button type="button" role="menuitem" class="menu-item" (click)="onGoHome()">
        <app-icon name="home"></app-icon><span>Salón</span>
      </button>
      <button type="button" role="menuitem" class="menu-item" (click)="onChangeName()">
        <app-icon name="pencil"></app-icon><span>Cambiar nombre</span>
      </button>
      <button type="button" role="menuitem" class="menu-item" (click)="onChangePassword()">
        <app-icon name="key"></app-icon><span>Cambiar contraseña</span>
      </button>
      <button type="button" role="menuitem" class="menu-item" (click)="onAddSaldo()">
        <app-icon name="ticket"></app-icon><span>Rasca y recarga</span>
      </button>
      <span class="menu-rule" role="separator"></span>
      <button type="button" role="menuitem" class="menu-item danger" (click)="onLogout()">
        <app-icon name="sign-out"></app-icon><span>Cerrar sesión</span>
      </button>
    </div>
  </div>
</header>
