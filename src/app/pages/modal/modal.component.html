<div class="modal-overlay">
  <div class="modal">
    <h2>{{ title }}</h2>
    <p>{{ message }}</p>

    <div *ngIf="isPrompt" class="input-wrapper">
      <input
        [type]="isPasswordField ? inputType : 'text'"
        [(ngModel)]="inputValue"
        [placeholder]="inputPlaceholder"
      />
      <button
        *ngIf="isPasswordField"
        type="button"
        class="toggle-visibility"
        (click)="togglePasswordVisibility()"
      >
        {{ inputType === 'password' ? '🔒' : '👁️' }}
      </button>
    </div>

    <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>

    <div class="modal-actions">
      <button (click)="aceptar()">{{ acceptText }}</button>
      <button class="cancel" (click)="cancelar()">{{ cancelText }}</button>
    </div>
  </div>
</div>
